version: "3.9"

services:
  backend:
    build: ./backend
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEFINITION_PATH=/app/data/definition.json
    volumes:
      # Mount the definition data from the repo root into the backend
      - ../data:/app/data:ro
      # Persist the SQLite database
      - squad_db:/app/db
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  squad_db:
